version: '3.9'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: /app/artifacts/mlruns
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
