services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLFLOW_TRACKING_URI: /app/artifacts/mlruns
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
